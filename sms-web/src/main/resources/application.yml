spring:
  application:
    name: ${WEB_APPLICATION_NAME:sms-web}
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${WEB_SERVER_PORT:9090}

sms:
  internal-rpc:
    # A deployment secret shared only by Web, AI and Knowledge services. Rotate it with a rolling restart.
    secret: ${INTERNAL_RPC_SECRET}
  web:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:7200}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}

dubbo:
  application:
    name: ${WEB_DUBBO_APPLICATION_NAME:sms-web-bff}
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
