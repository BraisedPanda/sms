spring:
  application:
    name: sms-ai
  config:
    import:
      - optional:file:.env[.properties]
      - optional:nacos:127.0.0.1:8848
  datasource:
    url: ${SMS_AI_DATASOURCE_URL:jdbc:mysql://localhost:3306/sms_dev?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SMS_AI_DATASOURCE_USERNAME:root}
    password: ${SMS_AI_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

dubbo:
  application:
    name: sms-ai-consumer
  registry:
    address: nacos://127.0.0.1:8848

server:
  port: 9091

sms:
  ai:
    embedding:
      # Local, free embedding service. Override these values for another OpenAI-compatible provider.
      endpoint: ${SMS_EMBEDDING_ENDPOINT:http://localhost:11434/v1/embeddings}
      token: ${SMS_EMBEDDING_TOKEN:}
      model: ${SMS_EMBEDDING_MODEL:bge-m3}
      dimensions: ${SMS_EMBEDDING_DIMENSIONS:1024}
    knowledge-ingestion:
      postgres:
        url: ${SMS_KNOWLEDGE_POSTGRES_URL:jdbc:postgresql://localhost:5432/sms-dev}
        username: ${SMS_KNOWLEDGE_POSTGRES_USERNAME:postgres}
        password: ${SMS_KNOWLEDGE_POSTGRES_PASSWORD:postgres123}
        table: ${SMS_KNOWLEDGE_POSTGRES_TABLE:ai_knowledge_chunk}
