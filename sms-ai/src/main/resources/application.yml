spring:
  application:
    name: ${AI_APPLICATION_NAME}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:nacos:${NACOS_SERVER_ADDR}
  datasource:
    url: ${AI_DATASOURCE_URL}
    username: ${AI_DATASOURCE_USERNAME}
    password: ${AI_DATASOURCE_PASSWORD}
    driver-class-name: ${AI_DATASOURCE_DRIVER_CLASS_NAME}

dubbo:
  application:
    name: ${AI_DUBBO_APPLICATION_NAME}
  registry:
    address: nacos://${NACOS_SERVER_ADDR}

server:
  port: ${AI_SERVER_PORT}

sms:
  ai:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS}
    embedding:
      endpoint: ${EMBEDDING_ENDPOINT}
      token: ${EMBEDDING_TOKEN}
      model: ${EMBEDDING_MODEL}
      dimensions: ${EMBEDDING_DIMENSIONS}
    knowledge-ingestion:
      default-limit: ${AI_KNOWLEDGE_INGESTION_DEFAULT_LIMIT}
      max-limit: ${AI_KNOWLEDGE_INGESTION_MAX_LIMIT}
      default-index-revision: ${AI_KNOWLEDGE_INGESTION_DEFAULT_INDEX_REVISION}
      postgres:
        url: ${KNOWLEDGE_POSTGRES_URL}
        username: ${KNOWLEDGE_POSTGRES_USERNAME}
        password: ${KNOWLEDGE_POSTGRES_PASSWORD}
        table: ${KNOWLEDGE_POSTGRES_TABLE}
    workflow:
      core-pool-size: ${AI_WORKFLOW_CORE_POOL_SIZE}
      max-pool-size: ${AI_WORKFLOW_MAX_POOL_SIZE}
      queue-capacity: ${AI_WORKFLOW_QUEUE_CAPACITY}
      max-attempts: ${AI_WORKFLOW_MAX_ATTEMPTS}
      step-timeout-ms: ${AI_WORKFLOW_STEP_TIMEOUT_MS}
      business-result-ttl-minutes: ${AI_WORKFLOW_BUSINESS_RESULT_TTL_MINUTES}
    task-recovery-delay-ms: ${AI_TASK_RECOVERY_DELAY_MS}
    sse-emitter-timeout-millis: ${AI_SSE_EMITTER_TIMEOUT_MILLIS}
    chat-memory-max-messages: ${AI_CHAT_MEMORY_MAX_MESSAGES}
