spring:
  application:
    name: ${SYSTEM_APPLICATION_NAME:sms-system-provider}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:nacos:${NACOS_SERVER_ADDR:127.0.0.1:8848}
  datasource:
    url: ${SYSTEM_DATASOURCE_URL:jdbc:mysql://localhost:3306/sms_dev?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SYSTEM_DATASOURCE_USERNAME:root}
    password: ${SYSTEM_DATASOURCE_PASSWORD:}
    driver-class-name: ${SYSTEM_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
server:
  port: ${SYSTEM_SERVER_PORT:9094}
dubbo:
  application:
    name: ${SYSTEM_DUBBO_APPLICATION_NAME:sms-system-provider}
  protocol:
    name: dubbo
    port: ${SYSTEM_DUBBO_PROTOCOL_PORT:20882}
  registry:
    address: nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}
  scan:
    base-packages: com.xqy.sms.system.provider.service
sms:
  system:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:7200}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:604800}
