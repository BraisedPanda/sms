spring:
  application:
    name: sms-knowledge-provider
  config:
    import: optional:nacos:127.0.0.1:8848
  datasource:
    url: ${SMS_KNOWLEDGE_DATASOURCE_URL:jdbc:mysql://localhost:3306/sms_dev?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${SMS_KNOWLEDGE_DATASOURCE_USERNAME:root}
    password: ${SMS_KNOWLEDGE_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

sms:
  knowledge:
    # Use "milvus" to route queryVector through Milvus; PostgreSQL/pgvector is the default.
    vector-store: ${SMS_KNOWLEDGE_VECTOR_STORE:postgres}
    postgres:
      url: ${SMS_KNOWLEDGE_POSTGRES_URL:jdbc:postgresql://localhost:5432/sms-dev}
      username: ${SMS_KNOWLEDGE_POSTGRES_USERNAME:postgres}
      password: ${SMS_KNOWLEDGE_POSTGRES_PASSWORD:postgres123}
      table: ${SMS_KNOWLEDGE_POSTGRES_TABLE:ai_knowledge_chunk}
    milvus:
      endpoint: ${SMS_MILVUS_ENDPOINT:http://localhost:9001/}
      token: ${SMS_MILVUS_TOKEN:}
      collection: ${SMS_MILVUS_COLLECTION:ai_knowledge_chunk}

server:
  port: 9093

dubbo:
  application:
    name: sms-knowledge-provider
  protocol:
    name: dubbo
    port: 20881
  registry:
    address: nacos://127.0.0.1:8848
  scan:
    base-packages: com.xqy.sms.knowledge.provider.service
