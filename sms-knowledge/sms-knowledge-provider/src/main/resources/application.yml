spring:
  application:
    name: ${KNOWLEDGE_APPLICATION_NAME}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:nacos:${NACOS_SERVER_ADDR}
  datasource:
    url: ${KNOWLEDGE_DATASOURCE_URL}
    username: ${KNOWLEDGE_DATASOURCE_USERNAME}
    password: ${KNOWLEDGE_DATASOURCE_PASSWORD}
    driver-class-name: ${KNOWLEDGE_DATASOURCE_DRIVER_CLASS_NAME}

sms:
  knowledge:
    # Use "milvus" to route queryVector through Milvus; PostgreSQL/pgvector is the default.
    vector-store: ${KNOWLEDGE_VECTOR_STORE}
    postgres:
      url: ${KNOWLEDGE_POSTGRES_URL}
      username: ${KNOWLEDGE_POSTGRES_USERNAME}
      password: ${KNOWLEDGE_POSTGRES_PASSWORD}
      table: ${KNOWLEDGE_POSTGRES_TABLE}
    milvus:
      endpoint: ${MILVUS_ENDPOINT}
      token: ${MILVUS_TOKEN}
      collection: ${MILVUS_COLLECTION}

server:
  port: ${KNOWLEDGE_SERVER_PORT}

dubbo:
  application:
    name: ${KNOWLEDGE_DUBBO_APPLICATION_NAME}
  protocol:
    name: dubbo
    port: ${KNOWLEDGE_DUBBO_PROTOCOL_PORT}
  registry:
    address: nacos://${NACOS_SERVER_ADDR}
  scan:
    base-packages: com.xqy.sms.knowledge.provider.service
